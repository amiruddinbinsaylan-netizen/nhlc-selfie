<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Absen Selfie NHLC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#dbe6ef,#c9dce9);color:#0b1626;min-height:100vh;display:flex;justify-content:center;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:460px}
.top{text-align:center;margin:6px 0 14px}
.top b{display:block;font-size:1.25rem;letter-spacing:3px;color:#1e3a57}
.top span{font-size:.8rem;color:#52697f}
.card{padding:18px;border-radius:24px;background:rgba(255,255,255,.86);border:1px solid #fff;box-shadow:0 12px 32px rgba(30,58,87,.2);text-align:center}
.who{font-size:.9rem;font-weight:600;color:#1e3a57}
.pose{margin:12px 0 8px;padding:14px;border-radius:16px;background:#fff3c4;border:2px solid #d4a017;font-size:1.15rem;font-weight:700;line-height:1.4;color:#5b4300}
.timer{margin-bottom:10px;font-size:.85rem;font-weight:600;color:#b45309;font-variant-numeric:tabular-nums}
.vwrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#0b1626}
.vwrap video,.vwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vwrap video{transform:scaleX(-1)}
.tip{margin:10px 0 0;font-size:.78rem;color:#52697f;line-height:1.5}
.status{min-height:20px;margin:8px 0;font-size:.85rem;font-weight:600;color:#1e3a57}
.btn{width:100%;padding:16px;border:none;border-radius:16px;font:inherit;font-size:1.05rem;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#4b7195,#1e3a57);box-shadow:0 8px 20px rgba(30,58,87,.3)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{color:#1e3a57;background:#e8f0f6;box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{width:72px;height:72px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;font-weight:700;color:#fff;background:#dc2626}
.big.ok{background:#16a34a}
.big.warn{background:#d97706}
h2{margin-bottom:6px;font-size:1.2rem}
.label{margin:8px 0 14px;font-size:1.1rem;font-weight:700}
.label.ok{color:#15803d}
.label.warn{color:#b45309}
.err p{font-size:.95rem;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>NHLC</b><span>Absen Selfie</span></div>

  <div class="card" id="s-load"><p>Memeriksa tiket...</p></div>

  <div class="card" id="s-cam" hidden>
    <div class="who" id="who"></div>
    <div class="pose" id="pose"></div>
    <div class="timer" id="timer"></div>
    <div class="vwrap"><video id="video" autoplay playsinline muted></video><img id="shot" alt="Hasil foto" hidden></div>
    <p class="tip">Wajah dan jari harus terlihat jelas. Pastikan cahaya cukup.</p>
    <p class="status" id="status"></p>
    <button class="btn" id="btn-snap" type="button" disabled>Ambil Foto</button>
    <div class="row" id="row-after" hidden>
      <button class="btn ghost" id="btn-retake" type="button">Ulangi</button>
      <button class="btn" id="btn-send" type="button">Kirim Absen</button>
    </div>
  </div>

  <div class="card" id="s-done" hidden>
    <div class="big ok" id="done-ic">&#10003;</div>
    <h2 id="done-title"></h2>
    <p id="done-jam"></p>
    <p class="label" id="done-label"></p>
    <button class="btn" id="btn-close" type="button">Tutup Halaman Ini</button>
    <p class="tip">Lalu kembali ke aplikasi NHLC. Statusnya terbarui otomatis.</p>
  </div>

  <div class="card err" id="s-err" hidden>
    <div class="big">!</div>
    <p id="err-msg"></p>
  </div>
</div>

<script>
(function () {
  'use strict';
  const API_URL = 'https://script.google.com/macros/s/AKfycbySTcmru3cEBdu5GOxhbTdMrrq_zVkWFBKn7HTeJFOSBILXJd-tz33w-Ues2dUtWGTv2Q/exec';     // <-- GANTI dengan alamat web app Apps Script (berakhiran /exec)

  const $ = id => document.getElementById(id);
  const ticket = new URLSearchParams(location.search).get('t') || '';
  let stream = null, photo = '', deadline = 0, timer = null, sending = false;

  function show(id) { ['s-load', 's-cam', 's-done', 's-err'].forEach(s => { $(s).hidden = s !== id; }); }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  function fail(msg) { stopCam(); clearInterval(timer); $('err-msg').textContent = msg; show('s-err'); }

  async function api(method, payload) {
    if (method === 'GET') {
      const r = await fetch(API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + new URLSearchParams(payload).toString());
      return r.json();
    }
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    return r.json();
  }

  function tick() {
    const s = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    $('timer').textContent = 'Sisa waktu ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s <= 0) { clearInterval(timer); if (!sending) fail('Waktu habis. Kembali ke aplikasi NHLC dan tekan tombol absen lagi.'); }
  }

  async function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nodevice');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('video');
    v.srcObject = stream;
    v.onloadedmetadata = () => { $('btn-snap').disabled = false; };
    try { await v.play(); } catch (e) {}
  }
  function camMsg(e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak. Ketuk ikon gembok di kolom alamat browser, izinkan Kamera, lalu muat ulang halaman ini.';
    if (n === 'NotFoundError' || (e && e.message === 'nodevice')) return 'Kamera tidak ditemukan di perangkat ini.';
    if (n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi itu lalu muat ulang halaman ini.';
    return 'Kamera tidak bisa dibuka (' + (n || 'kesalahan') + ').';
  }

  function snap() {
    const v = $('video');
    if (!v.videoWidth) return;
    const max = 720, k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    let q = 0.62, data = c.toDataURL('image/jpeg', q);           // kompres otomatis
    while (data.length > 150000 && q > 0.3) { q -= 0.1; data = c.toDataURL('image/jpeg', q); }
    photo = data;
    $('shot').src = data; $('shot').hidden = false; $('video').hidden = true;
    $('btn-snap').hidden = true; $('row-after').hidden = false;
    $('status').textContent = 'Periksa foto Anda: wajah dan jari harus terlihat jelas.';
  }
  function retake() {
    photo = '';
    $('shot').hidden = true; $('video').hidden = false;
    $('btn-snap').hidden = false; $('row-after').hidden = true;
    $('status').textContent = '';
  }

  function done(res) {
    stopCam(); clearInterval(timer);
    const good = !/Terlambat|lebih awal/i.test(res.label || '');
    $('done-ic').className = 'big ' + (good ? 'ok' : 'warn');
    $('done-ic').innerHTML = good ? '&#10003;' : '!';
    $('done-title').textContent = 'Absen ' + (res.jenis === 'masuk' ? 'Masuk' : 'Pulang') + ' Tercatat';
    $('done-jam').textContent = res.nama + ' \u2022 pukul ' + res.jam + ' WIB';
    $('done-label').textContent = res.label || '';
    $('done-label').className = 'label ' + (good ? 'ok' : 'warn');
    show('s-done');
  }

  async function send() {
    if (sending || !photo) return;
    sending = true;
    $('btn-send').disabled = true; $('btn-retake').disabled = true;
    $('status').textContent = 'Mengirim...';
    let res = null;
    for (let i = 0; i < 4; i++) {
      try { res = await api('POST', { action: 'absen', t: ticket, foto: photo }); }
      catch (e) { res = { ok: false, retry: true, message: 'Koneksi terputus.' }; }
      if (res.ok || !res.retry) break;
      $('status').textContent = (res.message || 'Server sibuk.') + ' Mencoba lagi (' + (i + 1) + '/3)...';
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
    sending = false;
    if (res && res.ok) return done(res);
    if (res && res.retry) {
      $('status').textContent = 'Belum berhasil terkirim. Periksa sinyal lalu tekan Kirim Absen lagi.';
      $('btn-send').disabled = false; $('btn-retake').disabled = false;
      return;
    }
    fail((res && res.message) || 'Absen gagal dicatat.');
  }

  async function start() {
    if (!ticket) return fail('Halaman ini harus dibuka dari tombol Absen di aplikasi NHLC.');
    if (API_URL.indexOf('https://') !== 0) return fail('Halaman kamera belum dikonfigurasi: isi API_URL di baris atas skrip dengan alamat web app (berakhiran /exec).');
    show('s-load');
    let info;
    try { info = await api('GET', { action: 'tiket', t: ticket }); }
    catch (e) { return fail('Tidak dapat terhubung ke server. Periksa internet Anda, dan pastikan alamat web app di file ini berakhiran /exec.'); }
    if (!info.ok) return fail(info.message || 'Tiket tidak valid.');
    $('who').textContent = info.nama + ' \u2022 Absen ' + (info.jenis === 'masuk' ? 'Masuk' : 'Pulang') + ' sesi ' + String(info.sesi).toLowerCase();
    $('pose').textContent = info.pose;
    deadline = Date.now() + info.sisa * 1000;
    clearInterval(timer); timer = setInterval(tick, 1000); tick();
    try { await openCam(); } catch (e) { return fail(camMsg(e)); }
    show('s-cam');
  }

  $('btn-snap').addEventListener('click', snap);
  $('btn-retake').addEventListener('click', retake);
  $('btn-send').addEventListener('click', send);
  $('btn-close').addEventListener('click', () => {
    window.close();
    setTimeout(() => { $('btn-close').textContent = 'Silakan tutup tab ini secara manual'; }, 400);
  });
  start();
})();
</script>
</body>
</html>
